<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#132445">
<title>Carnet de Route</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blueprint:#0F1D3A;
    --blueprint-2:#182D57;
    --blueprint-3:#1F3868;
    --line:#EAF1FF;
    --grid:#2B4478;
    --muted:#8FA6C9;
    --flare:#FF7A45;
    --flare-dim:#B85A34;
    --warn:#FFC857;
    --mint:#3ED9A0;
    --paper:#F7F8FB;
    --paper-dim:#EDEFF5;
    --ink:#132445;
    --ink-soft:#4A5A7D;
    --radius:10px;
    --radius-sm:6px;
    --shadow-1:0 1px 2px rgba(4,10,26,0.4), 0 8px 24px -8px rgba(4,10,26,0.55);
    --shadow-2:0 2px 6px rgba(4,10,26,0.35), 0 16px 40px -12px rgba(4,10,26,0.6);
  }
  *{box-sizing:border-box;}
  html{background:var(--blueprint);}
  body{
    margin:0; padding:0;
    background:
      repeating-linear-gradient(0deg, rgba(234,241,255,0.028) 0px, rgba(234,241,255,0.028) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(234,241,255,0.028) 0px, rgba(234,241,255,0.028) 1px, transparent 1px, transparent 40px),
      var(--blueprint);
    color:var(--line);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header.titleblock{
    padding:16px 18px 14px;
    border-bottom:1px solid var(--grid);
    display:flex; align-items:center; gap:10px;
  }
  header.titleblock .badge{
    width:34px; height:34px; flex-shrink:0; border-radius:9px;
    background:var(--flare);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-1);
  }
  header.titleblock .titles{min-width:0;}
  header.titleblock h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.02em;
    margin:0 0 2px;
  }
  header.titleblock p{
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--muted);
    text-transform:uppercase;
  }

  main{display:block;}

  .controls{
    padding:16px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:14px;
    border-bottom:1px solid var(--grid);
  }

  .field label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field-input{
    position:relative;
    display:flex;
    align-items:center;
    background:var(--blueprint-2);
    border:1px solid var(--grid);
    border-radius:var(--radius-sm);
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field-input:focus-within{
    border-color:var(--flare);
    box-shadow:0 0 0 3px rgba(255,122,69,0.18);
  }
  .field-input svg{flex-shrink:0; margin-left:11px; opacity:0.65;}
  .field-input input[type="text"]{
    width:100%;
    background:transparent;
    border:none;
    color:var(--line);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 12px;
    outline:none;
  }
  .field-input input[type="text"]::placeholder{color:var(--muted); opacity:0.55;}

  .field-row{display:flex; align-items:center; gap:12px;}

  .segmented{
    position:relative;
    display:flex;
    background:var(--blueprint-2);
    border:1px solid var(--grid);
    border-radius:var(--radius-sm);
    padding:3px;
    gap:2px;
  }
  .segmented-thumb{
    position:absolute;
    top:3px; bottom:3px; left:3px;
    width:calc((100% - 6px) / 3);
    background:var(--flare);
    border-radius:4px;
    box-shadow:var(--shadow-1);
    transition:transform 0.22s cubic-bezier(0.4,0,0.2,1);
    z-index:0;
  }
  .radiusBtn{
    position:relative; z-index:1;
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:0.02em;
    background:transparent;
    border:none;
    color:var(--muted);
    padding:9px 6px;
    border-radius:4px;
    transition:color 0.18s ease;
  }
  .radiusBtn[aria-pressed="true"]{color:var(--blueprint); font-weight:600;}
  .radiusBtn:focus-visible{outline:2px solid var(--line); outline-offset:2px;}

  .switch{
    position:relative;
    display:inline-flex; align-items:center;
    width:42px; height:25px;
    flex-shrink:0;
  }
  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2;}
  .switch .track{
    position:absolute; inset:0;
    background:var(--blueprint-2);
    border:1px solid var(--grid);
    border-radius:999px;
    transition:background 0.2s ease, border-color 0.2s ease;
    pointer-events:none;
  }
  .switch .thumb{
    position:absolute; top:2px; left:2px;
    width:19px; height:19px;
    background:var(--muted);
    border-radius:50%;
    transition:transform 0.2s cubic-bezier(0.4,0,0.2,1), background 0.2s ease;
    pointer-events:none;
  }
  .switch input:checked + .track{background:var(--flare); border-color:var(--flare);}
  .switch input:checked + .track + .thumb{transform:translateX(17px); background:var(--blueprint);}
  .switch input:focus-visible + .track{outline:2px solid var(--line); outline-offset:2px;}

  .checkline{
    display:flex; align-items:center; gap:10px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--line);
    cursor:pointer;
  }

  button.primary{
    position:relative;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.02em;
    background:var(--flare);
    color:var(--blueprint);
    border:none;
    padding:13px 14px;
    border-radius:var(--radius-sm);
    width:100%;
    box-shadow:var(--shadow-1);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
  }
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.7;}
  button.primary:focus-visible{outline:2px solid var(--line); outline-offset:2px;}
  .spinner{
    width:15px; height:15px;
    border:2px solid rgba(19,36,69,0.3);
    border-top-color:var(--blueprint);
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #status{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    min-height:14px;
    text-align:center;
  }

  .map-frame{
    padding:0 18px 14px;
  }
  .map-frame .map-inner{
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow-2);
    border:1px solid var(--grid);
  }
  #map{width:100%; height:50vh; min-height:300px;}

  section.results{
    padding:4px 18px calc(28px + env(safe-area-inset-bottom));
  }
  #resultsList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  #resultsList li{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:12px 13px;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:var(--shadow-1);
    animation:cardIn 0.32s cubic-bezier(0.2,0.6,0.3,1) backwards;
  }
  #resultsList li:nth-child(1){animation-delay:0.02s;}
  #resultsList li:nth-child(2){animation-delay:0.06s;}
  #resultsList li:nth-child(3){animation-delay:0.10s;}
  #resultsList li:nth-child(4){animation-delay:0.14s;}
  #resultsList li:nth-child(n+5){animation-delay:0.16s;}
  @keyframes cardIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .tag-top{display:flex; gap:11px; align-items:flex-start;}
  .tag-num{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:12px;
    background:var(--ink);
    color:var(--line);
    border-radius:50%;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 4px rgba(19,36,69,0.35);
  }
  .tag-body{flex:1; min-width:0;}
  .tag-name{font-weight:600; font-size:14.5px; line-height:1.3;}
  .tag-brand{font-weight:400; color:var(--ink-soft);}
  .tag-detail{font-family:'JetBrains Mono',monospace; font-size:11.5px; margin-top:4px; color:var(--ink-soft); line-height:1.5;}
  .tag-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .tag-badge.onroute{background:rgba(62,217,160,0.2); color:#166B49;}
  .tag-badge.detour{background:rgba(255,200,87,0.28); color:#7A5600;}

  .nav-links{display:flex; gap:7px; padding-left:35px;}
  .nav-links a{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    text-decoration:none;
    color:var(--paper);
    background:var(--ink);
    border-radius:var(--radius-sm);
    padding:8px 6px;
    transition:transform 0.12s ease, opacity 0.12s ease;
  }
  .nav-links a:active{transform:scale(0.96); opacity:0.85;}
  .nav-links a:focus-visible{outline:2px solid var(--flare); outline-offset:1px;}
  .nav-links a svg{flex-shrink:0;}
  .nav-links a.waze{background:#0F1D3A;}
  .nav-links a.gmaps{background:#1A3A6B;}
  .nav-links a.apple{background:#33475F;}

  .empty{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:36px 20px;
  }
  .empty svg{opacity:0.5;}

  @media (min-width: 820px){
    body{display:flex; flex-direction:column; height:100dvh; overflow:hidden;}
    header.titleblock{flex-shrink:0;}
    main{flex:1; display:flex; flex-direction:row; min-height:0; overflow:hidden;}
    .controls{width:300px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--grid); border-bottom:none;}
    .map-frame{flex:1; display:flex; padding:16px;}
    .map-frame .map-inner{flex:1;}
    #map{width:100%; height:100%; min-height:0;}
    section.results{width:340px; flex-shrink:0; border-left:1px solid var(--grid); overflow-y:auto; padding-top:16px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>

<header class="titleblock">
  <div class="badge">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="#132445"/><circle cx="12" cy="10" r="3.2" fill="#3ED9A0"/></svg>
  </div>
  <div class="titles">
    <h1>Carnet de Route</h1>
    <p>Stations-service sur votre trajet</p>
  </div>
</header>

<main>
  <section class="controls">
    <div class="field">
      <label for="originInput">Position actuelle</label>
      <div class="field-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/></svg>
        <input type="text" id="originInput" placeholder="Détectée automatiquement, ou lat,lng">
      </div>
    </div>
    <div class="field">
      <label for="destInput">Destination</label>
      <div class="field-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>
        <input type="text" id="destInput" placeholder="Adresse ou ville d'arrivée">
      </div>
    </div>
    <div class="field">
      <label for="brandInput">Marque recherchée</label>
      <div class="field-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V8l6-4 6 4v13"/><path d="M10 21v-6h4v6M15 10h3a2 2 0 0 1 2 2v3.5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
        <input type="text" id="brandInput" placeholder="Ex. Total, Shell, Esso">
      </div>
    </div>

    <div class="field">
      <label>Détour accepté</label>
      <div class="segmented" role="group" aria-label="Rayon de détour accepté">
        <span class="segmented-thumb" id="segThumb"></span>
        <button type="button" class="radiusBtn" data-r="0" data-i="0" aria-pressed="true">Aucun</button>
        <button type="button" class="radiusBtn" data-r="1" data-i="1" aria-pressed="false">1 km</button>
        <button type="button" class="radiusBtn" data-r="5" data-i="2" aria-pressed="false">5 km</button>
      </div>
    </div>

    <div class="field-row">
      <label class="checkline" for="openOnlyCheck" style="margin:0;">Ouvertes uniquement à l'arrivée</label>
      <span class="switch">
        <input type="checkbox" id="openOnlyCheck">
        <span class="track"></span>
        <span class="thumb"></span>
      </span>
    </div>

    <button type="button" class="primary" id="searchBtn">
      <span id="searchBtnLabel">Rechercher</span>
    </button>
    <div id="status" aria-live="polite"></div>
  </section>

  <div class="map-frame">
    <div class="map-inner"><div id="map"></div></div>
  </div>

  <section class="results">
    <ol id="resultsList"></ol>
  </section>
</main>

<script>
  // ————————————————————————————————————————————————————————————
  // Config
  // ————————————————————————————————————————————————————————————
  const MAX_RADIUS_KM = 5;              // plus grande option de rayon proposée (préfiltre géométrique des candidats)
  const ON_ROUTE_EXTRA_KM_TOLERANCE = 0.3; // en-dessous de ce détour routier réel, la station est classée "sur le trajet"
  const SAMPLE_STEP_KM = 2;
  const SEARCH_RADIUS_M = 3000;

  const BLUEPRINT_STYLE = [
    { elementType: 'geometry', stylers: [{ color: '#0F1D3A' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#0F1D3A' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#8FA6C9' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#28407A' }] },
    { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#DCE8FF' }, { weight: 0.5 }] },
    { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#3A5A9E' }] },
    { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#DCE8FF' }, { weight: 0.8 }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0A1530' }] },
    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit', stylers: [{ visibility: 'off' }] },
    { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#28407A' }, { weight: 0.5 }] },
    { featureType: 'administrative.land_parcel', stylers: [{ visibility: 'off' }] }
  ];

  // ————————————————————————————————————————————————————————————
  // État
  // ————————————————————————————————————————————————————————————
  let map, directionsRenderer, markers = [];
  let allStations = [];
  let currentRadius = 0;
  let destAutocomplete;

  // ————————————————————————————————————————————————————————————
  // Géométrie (équivalent client-side du script Node)
  // ————————————————————————————————————————————————————————————
  function round1(n) { return Math.round(n * 10) / 10; }

  function buildCumulative(path) {
    const cum = [0];
    for (let i = 1; i < path.length; i++) {
      cum.push(cum[i - 1] + google.maps.geometry.spherical.computeDistanceBetween(path[i - 1], path[i]) / 1000);
    }
    return cum;
  }

  function nearestOnRoute(point, path, cum) {
    let best = { dist: Infinity, index: 0 };
    for (let i = 0; i < path.length; i++) {
      const d = google.maps.geometry.spherical.computeDistanceBetween(point, path[i]) / 1000;
      if (d < best.dist) best = { dist: d, index: i };
    }
    return { offsetKm: best.dist, cumKm: cum[best.index] };
  }

  function samplePointsAhead(path, cum, fromCumKm, stepKm) {
    const samples = [];
    let next = fromCumKm;
    for (let i = 0; i < path.length; i++) {
      if (cum[i] >= next) { samples.push(path[i]); next += stepKm; }
    }
    return samples;
  }

  function parseLatLng(str) {
    if (!/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(str)) return null;
    const [lat, lng] = str.split(',').map(Number);
    return { lat, lng };
  }

  function routeTotals(route) {
    return {
      km: route.legs.reduce((s, l) => s + l.distance.value, 0) / 1000,
      min: route.legs.reduce((s, l) => s + l.duration.value, 0) / 60
    };
  }

  // ————————————————————————————————————————————————————————————
  // Horaires d'ouverture à l'heure d'arrivée estimée
  // ————————————————————————————————————————————————————————————
  function parseTimeToMinutes(hhmm) { return Number(hhmm.slice(0, 2)) * 60 + Number(hhmm.slice(2, 4)); }

  function isOpenAtArrival(openingHours, utcOffsetMinutes, arrivalUtcMs) {
    if (!openingHours || !Array.isArray(openingHours.periods)) return null;
    const periods = openingHours.periods;
    if (periods.length === 1 && !periods[0].close) return true;
    if (typeof utcOffsetMinutes !== 'number') return null;

    const local = new Date(arrivalUtcMs + utcOffsetMinutes * 60000);
    const arrivalDay = local.getUTCDay();
    const arrivalMinutes = local.getUTCHours() * 60 + local.getUTCMinutes();
    const arrivalAbs = arrivalDay * 1440 + arrivalMinutes;

    for (const p of periods) {
      if (!p.close) continue;
      const openAbs = p.open.day * 1440 + parseTimeToMinutes(p.open.time);
      let closeAbs = p.close.day * 1440 + parseTimeToMinutes(p.close.time);
      if (closeAbs <= openAbs) closeAbs += 7 * 1440;
      if ((arrivalAbs >= openAbs && arrivalAbs <= closeAbs) ||
          (arrivalAbs + 7 * 1440 >= openAbs && arrivalAbs + 7 * 1440 <= closeAbs)) return true;
    }
    return false;
  }

  function formatLocalTime(utcOffsetMinutes, arrivalUtcMs) {
    const local = new Date(arrivalUtcMs + utcOffsetMinutes * 60000);
    return String(local.getUTCHours()).padStart(2, '0') + ':' + String(local.getUTCMinutes()).padStart(2, '0');
  }

  // ————————————————————————————————————————————————————————————
  // Appels Places (promisifiés)
  // ————————————————————————————————————————————————————————————
  function searchBrandStations(service, point, brand) {
    return new Promise((resolve) => {
      service.nearbySearch({ location: point, radius: SEARCH_RADIUS_M, keyword: brand, type: 'gas_station' }, (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results) {
          resolve(results.map((r) => ({
            placeId: r.place_id, name: r.name,
            lat: r.geometry.location.lat(), lng: r.geometry.location.lng(),
            address: r.vicinity || ''
          })));
        } else resolve([]);
      });
    });
  }

  function getPlaceDetails(service, placeId) {
    return new Promise((resolve) => {
      service.getDetails({ placeId, fields: ['opening_hours', 'utc_offset_minutes'] }, (place, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && place) {
          resolve({
            opening_hours: place.opening_hours ? { periods: place.opening_hours.periods } : null,
            utcOffsetMinutes: place.utc_offset_minutes
          });
        } else resolve({ opening_hours: null, utcOffsetMinutes: null });
      });
    });
  }

  // ————————————————————————————————————————————————————————————
  // Recherche principale
  // ————————————————————————————————————————————————————————————
  async function handleSearch() {
    const originVal = document.getElementById('originInput').value.trim();
    const destVal = document.getElementById('destInput').value.trim();
    const brand = document.getElementById('brandInput').value.trim();
    const status = document.getElementById('status');
    const btn = document.getElementById('searchBtn');
    const btnLabel = document.getElementById('searchBtnLabel');

    if (!originVal || !destVal || !brand) {
      status.textContent = 'Renseignez la position actuelle, la destination et la marque.';
      return;
    }

    btn.disabled = true;
    btnLabel.innerHTML = '<span class="spinner"></span> Recherche…';
    status.textContent = 'Calcul du trajet…';

    try {
      const directionsService = new google.maps.DirectionsService();
      const placesService = new google.maps.places.PlacesService(map);
      const originCoords = parseLatLng(originVal);
      const originParam = originCoords || originVal;

      const result = await directionsService.route({
        origin: originParam, destination: destVal, travelMode: google.maps.TravelMode.DRIVING
      });
      const route = result.routes[0];
      directionsRenderer.setDirections(result);

      const path = route.overview_path;
      const cum = buildCumulative(path);
      const vehiclePoint = originCoords ? new google.maps.LatLng(originCoords.lat, originCoords.lng) : path[0];
      const fromCumKm = nearestOnRoute(vehiclePoint, path, cum).cumKm;

      status.textContent = 'Recherche des stations le long du trajet…';
      const samples = samplePointsAhead(path, cum, fromCumKm, SAMPLE_STEP_KM);
      const foundMap = new Map();
      for (const p of samples) {
        const results = await searchBrandStations(placesService, p, brand);
        for (const r of results) foundMap.set(r.placeId, r);
      }

      const candidates = [];
      for (const st of foundMap.values()) {
        const proj = nearestOnRoute(new google.maps.LatLng(st.lat, st.lng), path, cum);
        if (proj.cumKm < fromCumKm - 0.5) continue;
        if (proj.offsetKm > MAX_RADIUS_KM) continue;
        candidates.push({ ...st, offsetKm: proj.offsetKm, cumKm: proj.cumKm });
      }

      status.textContent = candidates.length
        ? 'Calcul des détours et horaires (' + candidates.length + ' station(s))…'
        : 'Aucune station de cette marque trouvée dans les ' + MAX_RADIUS_KM + ' km autour du trajet.';

      const enriched = [];
      for (const s of candidates) {
        const kmAhead = round1(s.cumKm - fromCumKm);

        // Toujours calculer le vrai itinéraire routier (origine -> station -> destination).
        // Google ne génère jamais un demi-tour interdit : si la station est sur la chaussée
        // opposée (typiquement sur autoroute), le détour réel via la prochaine sortie apparaît
        // ici, même si la station semblait géométriquement "sur le trajet".
        const viaResult = await directionsService.route({
          origin: originParam, destination: destVal,
          waypoints: [{ location: { lat: s.lat, lng: s.lng }, stopover: true }],
          travelMode: google.maps.TravelMode.DRIVING
        });
        const direct = routeTotals(route);
        const via = routeTotals(viaResult.routes[0]);
        const etaMin = viaResult.routes[0].legs[0].duration.value / 60;
        const realExtraKm = round1(via.km - direct.km);
        const realExtraMin = Math.round(via.min - direct.min);
        const onRoute = realExtraKm < ON_ROUTE_EXTRA_KM_TOLERANCE;

        const entry = {
          ...s, kmAhead, onRoute, etaMin,
          extraKm: onRoute ? 0 : realExtraKm,
          extraMin: onRoute ? 0 : realExtraMin
        };

        const details = await getPlaceDetails(placesService, entry.placeId);
        const arrivalUtcMs = Date.now() + entry.etaMin * 60000;
        entry.openAtArrival = isOpenAtArrival(details.opening_hours, details.utcOffsetMinutes, arrivalUtcMs);
        entry.arrivalLocal = typeof details.utcOffsetMinutes === 'number' ? formatLocalTime(details.utcOffsetMinutes, arrivalUtcMs) : null;

        enriched.push(entry);
      }

      enriched.sort((a, b) => a.cumKm - b.cumKm);
      allStations = enriched;
      status.textContent = '';
      renderAll();
    } catch (err) {
      status.textContent = 'Erreur : ' + err.message;
    } finally {
      btn.disabled = false;
      btnLabel.textContent = 'Rechercher';
    }
  }

  // ————————————————————————————————————————————————————————————
  // Rendu (filtrage 100% côté client, sans nouvel appel réseau)
  // ————————————————————————————————————————————————————————————
  const NAV_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 21l8-4.5L20 21 12 2Z"/></svg>';

  function renderAll() {
    const openOnly = document.getElementById('openOnlyCheck').checked;
    const list = document.getElementById('resultsList');
    markers.forEach((m) => m.setMap(null));
    markers = [];
    list.innerHTML = '';

    const filtered = allStations.filter((s) => {
      const withinRadius = currentRadius === 0 ? s.onRoute : s.extraKm <= currentRadius;
      if (!withinRadius) return false;
      if (openOnly && s.openAtArrival !== true) return false;
      return true;
    });

    if (filtered.length === 0) {
      const emptyIcon = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>';
      list.innerHTML = '<li class="empty" style="background:none; box-shadow:none; animation:none;">' + emptyIcon + '<span>' +
        (allStations.length === 0 ? 'Lancez une recherche pour voir les stations.' : 'Aucune station ne correspond à ces filtres.') +
        '</span></li>';
      return;
    }

    filtered.forEach((s, i) => {
      const color = s.onRoute ? '#3ED9A0' : '#FFC857';
      const marker = new google.maps.Marker({
        position: { lat: s.lat, lng: s.lng },
        map,
        label: { text: String(i + 1), color: '#0F1D3A', fontWeight: '700', fontFamily: 'JetBrains Mono' },
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 12, fillColor: color, fillOpacity: 1, strokeColor: '#0F1D3A', strokeWeight: 2 }
      });
      markers.push(marker);

      const li = document.createElement('li');
      const arrival = s.arrivalLocal ? ' · arrivée ~' + s.arrivalLocal : '';
      const detail = s.onRoute
        ? 'Sur le trajet, vers le km ' + s.kmAhead + ' devant vous' + arrival
        : 'Détour +' + s.extraKm + ' km, +' + s.extraMin + ' min, vers le km ' + s.kmAhead + ' devant vous' + arrival;
      const badgeClass = s.onRoute ? 'onroute' : 'detour';
      const badgeText = s.onRoute ? 'Sur le trajet' : 'Détour';

      const wazeUrl = 'https://waze.com/ul?ll=' + s.lat + ',' + s.lng + '&navigate=yes';
      const gmapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng +
        '&destination_place_id=' + encodeURIComponent(s.placeId) + '&travelmode=driving';
      const appleUrl = 'https://maps.apple.com/?daddr=' + s.lat + ',' + s.lng + '&dirflg=d';

      li.innerHTML =
        '<div class="tag-top">' +
          '<span class="tag-num">' + (i + 1) + '</span>' +
          '<span class="tag-body">' +
            '<div class="tag-name">' + s.name + ' <span class="tag-brand">· ' + escapeHtml(document.getElementById('brandInput').value.trim()) + '</span></div>' +
            '<div class="tag-detail">' + detail + '</div>' +
          '</span>' +
          '<span class="tag-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '</div>' +
        '<div class="nav-links">' +
          '<a class="waze" href="' + wazeUrl + '" target="_blank" rel="noopener">' + NAV_ICON + 'Waze</a>' +
          '<a class="gmaps" href="' + gmapsUrl + '" target="_blank" rel="noopener">' + NAV_ICON + 'Maps</a>' +
          '<a class="apple" href="' + appleUrl + '" target="_blank" rel="noopener">' + NAV_ICON + 'Plans</a>' +
        '</div>';
      list.appendChild(li);
    });
  }

  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ————————————————————————————————————————————————————————————
  // Initialisation
  // ————————————————————————————————————————————————————————————
  function initApp() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 46.6, lng: 2.4 }, zoom: 6, styles: BLUEPRINT_STYLE,
      disableDefaultUI: true, zoomControl: true
    });
    directionsRenderer = new google.maps.DirectionsRenderer({
      map, suppressMarkers: true, polylineOptions: { strokeColor: '#DCE8FF', strokeWeight: 4 }
    });

    const segThumb = document.getElementById('segThumb');
    document.querySelectorAll('.radiusBtn').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.radiusBtn').forEach((x) => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        currentRadius = parseFloat(b.dataset.r);
        segThumb.style.transform = 'translateX(' + (100 * Number(b.dataset.i)) + '%)';
        renderAll();
      });
    });
    document.getElementById('openOnlyCheck').addEventListener('change', renderAll);
    document.getElementById('searchBtn').addEventListener('click', handleSearch);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { document.getElementById('originInput').value = pos.coords.latitude.toFixed(5) + ',' + pos.coords.longitude.toFixed(5); },
        () => { document.getElementById('status').textContent = 'Position non détectée : saisissez-la manuellement (lat,lng).'; },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }
  }
  window.initApp = initApp;
</script>

<!-- Remplacez YOUR_API_KEY_ICI par votre clé Google Maps Platform (voir SETUP-APP-IOS.md) -->
<script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_ICI&libraries=places,geometry&callback=initApp"></script>
